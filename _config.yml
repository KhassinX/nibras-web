title: Nibras
short_name: Nibras
app_category: Reference
description: A reverent reader of the Qur'an in Arabic, with translations of the meaning, and an on-device, non-generative concordance — it surfaces connections, never interprets. Privacy-first, for iPhone and iPad.
description_es: "Un lector reverente del Corán en árabe, con traducciones del significado y una concordancia en el dispositivo y no generativa: muestra conexiones, nunca interpreta. Privado por diseño, para iPhone y iPad."
url: https://nibras.khassinx.com
lang: en

# Layer 2 brand tokens (Nibras specific) extending Layer 3 primitives
app_tokens_css: /assets/css/nibras-tokens.css

# Favicons (Nibras brand pack — aniconic rub-el-hizb star-light, teal + gold)
# SVG primary for modern browsers, PNG fallbacks for legacy + iOS home screen
favicon_svg: /assets/favicons/favicon.svg
favicon_32: /assets/favicons/favicon-32.png
favicon_16: /assets/favicons/favicon-16.png
apple_touch_icon: /assets/favicons/apple-touch-icon.png

# Social / Open Graph + Twitter
og_site_name: Nibras
og_image: /assets/og/og-image.png
og_image_es: /assets/og/og-image-es.png
og_image_alt: "Nibras — a guiding light for the Qur'an."
og_image_alt_es: "Nibras — una luz que guía hacia el Corán."
og_image_width: 1200
og_image_height: 630
twitter_card: summary_large_image

# JSON-LD (SoftwareApplication, publisher KHASSINX). `name` is the brand wordmark;
# `legal_name` is the registered legal entity (used in footer/JSON-LD/legal pages).
org:
  name: KHASSINX
  legal_name: KHASSINX LLC

# Navigation — keyed per locale. Sin nav: el encabezado es sólo el wordmark: cada destino ya está en el pie.
footer_nav:
  en:
    - title: Privacy
      url: /legal/privacy/
    - title: Terms
      url: /legal/terms/
    - title: Legal
      url: /legal/
    - title: Security
      url: /security/
    - title: Support
      url: /support/
    - title: Contact
      url: /contact/
  es:
    - title: Privacidad
      url: /es/legal/privacy/
    - title: Términos
      url: /es/legal/terms/
    - title: Legal
      url: /es/legal/
    - title: Seguridad
      url: /es/security/
    - title: Soporte
      url: /es/support/
    - title: Contacto
      url: /es/contact/

# UI strings (skip-link y nota de ecosistema del footer) consumed by base.html
ui_strings:
  en:
    skip_to_main: "Skip to main content"
    ecosystem_label: "A KHASSINX app"
    ecosystem_url: "https://khassinx.com"
  es:
    skip_to_main: "Saltar al contenido principal"
    ecosystem_label: "Una app de KHASSINX"
    ecosystem_url: "https://khassinx.com/es/"

# Jekyll config
markdown: kramdown
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

exclude:
  - README.md
  - CONTRIBUTING.md
  - .gitignore
  - LICENSE

# Jekyll por default ignora dotfiles/dotdirs. .well-known DEBE servirse
# (RFC 9116 security.txt requiere path exacto /.well-known/security.txt).
include:
  - .well-known

# Portfolio design system (2026-10): header icon and chrome strings, read by _layouts/base.html and prose.html.
header_icon: /assets/favicons/icon-192.png
header_tm: true
ui_theme:
  en:
    skip_to_main: "Skip to main content"
    nav_primary: "Main"
    nav_footer: "Footer"
    lang_selector: "Language selector"
    umbrella_url: "https://khassinx.com/"
    last_updated: "Last updated"
    theme: "Theme"
    theme_system: "System"
    theme_light: "Light"
    theme_dark: "Dark"
  es:
    skip_to_main: "Saltar al contenido principal"
    nav_primary: "Principal"
    nav_footer: "Pie de página"
    lang_selector: "Selector de idioma"
    umbrella_url: "https://khassinx.com/es/"
    last_updated: "Última actualización"
    theme: "Tema"
    theme_system: "Sistema"
    theme_light: "Claro"
    theme_dark: "Oscuro"
